name: Prepare ALBot reconciled generated runtime
on:
  push:
    branches:
      - codex/live-037-staff-hunt-party-risk-20261023
permissions:
  contents: write
concurrency:
  group: albot-prepare-live-037
  cancel-in-progress: false
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'prepare(runtime):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build exact browser and signed-channel runtime candidates
        run: npm run build
      - name: Regenerate personalized comparison file without changing settings
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild matching editor
        run: npm run build:editor
      - name: Verify and test exact generated tree before publishing
        run: |
          node scripts/sync-personal-code.mjs --check
          npm test
      - name: Commit generated comparison assets to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist/ editor/Bot-Werkstatt.html editor/albot.settings.json
          if git diff --cached --quiet; then
            echo "Generated assets unchanged"
            exit 0
          fi
          git commit -m "prepare(runtime): synchronize generated 0.38 candidate artifacts"
          git push origin HEAD:codex/live-037-staff-hunt-party-risk-20261023
