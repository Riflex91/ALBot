# One-off branch-only runtime sync and cross-platform regression, delete after.
name: W04 and PR159 temporary cross-platform integration
on:
  push:
    branches: [codex/w00-w01-readonly-disposition-20261018]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w00-w01-readonly-disposition-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - shell: bash
        run: |
          if git diff --quiet -- bot.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js
          git commit -m "build(merge159): synchronize personal runtime with G11 and W04"
          git push origin HEAD:codex/w00-w01-readonly-disposition-20261018
  linux-verification:
    needs: [sync]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w00-w01-readonly-disposition-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --check
      - run: npm test
      - run: npm run build:editor
      - shell: bash
        run: |
          node --check dist/albot.js
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const code=fs.readFileSync('dist/albot.js');
          const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));
          const sha256=crypto.createHash('sha256').update(code).digest('hex');
          if(code.length>1048576||m.bytes!==code.length||m.sha256!==sha256)
            throw new Error('Bundle or manifest integrity failed');
          console.log(JSON.stringify({bytes:code.length,sha256,version:m.version}));
          EOF
  windows-verification:
    needs: [sync]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w00-w01-readonly-disposition-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - shell: pwsh
        run: ./scripts/VERIFY-U01-U07.ps1
