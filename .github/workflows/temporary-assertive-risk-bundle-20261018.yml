name: Temporary assertive-risk personalized bundle synchronization
# Regenerate after final squad-cohesion and Monsterhunt source fixes.
on:
  push:
    branches:
      - fix/foreign-targets-assertive-farm-risk-20261018
    paths:
      - .github/workflows/temporary-assertive-risk-bundle-20261018.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foreign-targets-assertive-farm-risk-20261018
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - name: Persist generated personalized bot.js only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js
          git diff --cached --exit-code && exit 0
          git commit -m "chore: regenerate personalized bot.js with assertive farming profile"
          git push origin HEAD:fix/foreign-targets-assertive-farm-risk-20261018
