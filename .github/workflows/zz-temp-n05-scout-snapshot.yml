name: TEMP N05 scout snapshot runtime sync
on:
  push:
    branches: [roadmap/n05-scout-observation-fail-closed-20261023]
permissions: {contents: write}
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node --test test/roadmap-n05-approved-local-scout-hop.test.mjs test/roadmap-n05-respawn-evidence.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Commit synchronized 0.37 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u bot.js dist editor profiles
          if ! git diff --cached --quiet; then
            git commit -m "build: sync N05 verified local scout runtime"
            git push origin "HEAD:roadmap/n05-scout-observation-fail-closed-20261023"
          fi
