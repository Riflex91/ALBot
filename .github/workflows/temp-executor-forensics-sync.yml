name: Temporary executor forensic artifact sync
on:
  push:
    branches:
      - fix/20261020-executor-action-terminal-telemetry
    paths:
      - '.github/workflows/temp-executor-forensics-sync.yml'
permissions:
  contents: write
jobs:
  build-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261020-executor-action-terminal-telemetry
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild runtime and test all action controls
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          node --test test/20261020-executor-terminal-telemetry.test.mjs
          npm test
      - name: Commit only generated artifacts
        shell: bash
        run: |
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync executor action-terminal telemetry runtime'
          git pull --rebase origin fix/20261020-executor-action-terminal-telemetry
          git push origin HEAD:refs/heads/fix/20261020-executor-action-terminal-telemetry
