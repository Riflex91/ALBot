name: Temporary owned-runtime 0.57 candidate build
on:
  push:
    branches:
      - feat/real-runtime-owned-resources-20261024
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]' && github.repository == 'Riflex91/ALBot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify real resource ownership, LIFO cleanup and fault containment
        run: node --test konfigurator/test/real-boot-resource-ownership.test.mjs konfigurator/test/config-sync-real-boot-graph.test.mjs
      - name: Build unsigned candidate, preserve personal CODE and verify runtime
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          npm test
      - name: Commit only verified runtime/editor artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bot.js dist/albot.bootstrap.auto.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html editor/albot.settings.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(candidate): sync owned boot resource runtime 0.57'
            git push origin HEAD:feat/real-runtime-owned-resources-20261024
          fi
