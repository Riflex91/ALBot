name: Temporary N12 critical Cave heal artifact builder
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: n12-critical-heal-build
  cancel-in-progress: true
jobs:
  build-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/n12-cave-critical-heal-triage-20261020' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n12-cave-critical-heal-triage-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Critical triage and Cave regression tests
        run: node --test test/roadmap-n12-cave-critical-heal-triage.test.mjs test/roadmap-n12-cave-priest-healing.test.mjs test/roadmap-n12-cave-cumulative-threat.test.mjs test/roadmap-n12-cave-multi-aggro-focus.test.mjs test/roadmap-n12-cave-defensive-basic.test.mjs
      - name: Full offline tests
        run: npm test
      - name: Build browser and headless bundles
        run: npm run build
      - name: Retain private CODE settings
        run: node scripts/sync-personal-code.mjs --write
      - name: Build standalone editor
        run: npm run build:editor
      - name: Check runtime-source parity
        run: node scripts/sync-personal-code.mjs --check
      - name: Commit generated tracked artifacts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo 'Artifacts already match.'
          else
            git commit -m 'build(N12): regenerate critical heal triage runtime and editor'
            git push origin HEAD:codex/n12-cave-critical-heal-triage-20261020
          fi
