name: PR157 temporary merge diagnostics (read-only)
on:
  push:
    branches:
      - codex/w00-w01-readonly-disposition-20261018
    paths:
      - .github/workflows/pr157-integration-dry-run.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Get latest main and inspect real merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'ALBot CI merge diagnostics'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          echo "HEAD $(git rev-parse HEAD)"
          echo "MAIN $(git rev-parse origin/main)"
          if git merge --no-commit --no-ff origin/main; then
            echo "PLAIN_MERGE_CLEAN"
          else
            echo "PLAIN_MERGE_CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U
            echo "PLAIN_MERGE_CONFLICTS_END"
          fi
          git merge --abort
      - name: Construct throwaway merge using PR side only on overlapping conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git merge --no-commit --no-ff -X ours origin/main || {
            echo "OURS_MERGE_REMAINING_CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U
            echo "OURS_MERGE_REMAINING_CONFLICTS_END"
            exit 1
          }
          git diff --cached --check
          echo "THROWAWAY_MERGE_CONSTRUCTED"
      - name: Verify personal settings from newer main are not overwritten
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const a=fs.readFileSync('bot.js','utf8');
          const b=execFileSync('git',['show','origin/main:bot.js'],{encoding:'utf8'});
          function cfg(s){
            const x=s.indexOf('globalThis.ALBotConfig='),y=s.indexOf('/* ALBot ',x);
            if(x<0||y<x)throw Error('Config boundary not found');
            return s.slice(x,y);
          }
          if(cfg(a)!==cfg(b))throw Error('PERSONAL_SETTINGS_DIVERGED_FROM_MAIN');
          console.log('PERSONAL_SETTINGS_IDENTICAL_TO_MAIN');
          EOF
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Offline tests for throwaway merge
        run: npm test
      - name: Build merged runtime
        run: npm run build
      - name: Sync personalized CODE without changing user config
        run: node scripts/sync-personal-code.mjs --write
      - name: Verify personal settings again after rebuild
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const a=fs.readFileSync('bot.js','utf8');
          const b=execFileSync('git',['show','origin/main:bot.js'],{encoding:'utf8'});
          function cfg(s){const x=s.indexOf('globalThis.ALBotConfig='),y=s.indexOf('/* ALBot ',x);if(x<0||y<x)throw Error('Missing config boundary');return s.slice(x,y);}
          if(cfg(a)!==cfg(b))throw Error('PERSONAL_SETTINGS_DRIFT_AFTER_BUILD');
          console.log('PERSONAL_SETTINGS_PRESERVED_AFTER_BUILD');
          EOF
      - name: Build editor and verify permanent bootstrap
        run: |
          npm run build:editor
          npm run check:bootstrap:auto
          git diff --check
      - name: No changes are pushed or released
        run: echo "DRY_RUN_ONLY_NO_COMMIT_NO_PUSH_NO_PUBLISH"
