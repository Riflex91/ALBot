name: Temporary ALBot squad-convergence artifact parity
on:
  push:
    branches: [codex/fix-emergency-squad-regroup-20261019]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build real runtime with latest squad behavior
        run: npm run build
      - name: Preserve exact personal configuration and sync version
        run: node scripts/sync-personal-code.mjs --write
      - name: Regenerate matching editor
        run: npm run build:editor
      - name: Verify bootstrap contract against generated artifacts
        run: node scripts/verify-bootstrap-contract.mjs
      - name: New regression suite and full offline tests
        run: npm test
      - name: Publish reproducible build files to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html
          git rm -- .github/workflows/branch-build-squad-convergence.yml
          git commit -m "build(combat): regenerate 0.16 bootstrap runtime and remove temporary workflow [skip ci]"
          git push origin HEAD:codex/fix-emergency-squad-regroup-20261019
