name: Temporary bounded follower fight verification
on:
  push:
    branches:
      - fix/20261020-follower-safe-spawn-engagement
    paths:
      - '.github/workflows/temp-follower-bounded-sync.yml'
permissions:
  contents: write
jobs:
  complete-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261020-follower-safe-spawn-engagement
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build runtime, verify direct and existing combat tests
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          node --test test/20261020-follower-bounded-spawn.test.mjs test/20261020-independent-farmer-one-shot.test.mjs
          npm test
      - name: Persist only generated code artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: align safe follower spawn fix runtime'
          git pull --rebase origin fix/20261020-follower-safe-spawn-engagement
          git push origin HEAD:refs/heads/fix/20261020-follower-safe-spawn-engagement
