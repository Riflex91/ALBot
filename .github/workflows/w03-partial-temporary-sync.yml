# One-time generated personal bot synchronization; remove after success.
name: W03 partial recovery temporary bundle sync
on:
  push:
    branches: [codex/w00-w01-readonly-disposition-20261018]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  sync:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/w00-w01-readonly-disposition-20261018') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/w00-w01-readonly-disposition-20261018')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w00-w01-readonly-disposition-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - shell: bash
        run: |
          if git diff --quiet -- bot.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js
          git commit -m "build(W03): synchronize addressed partial bank recovery"
          git push origin HEAD:codex/w00-w01-readonly-disposition-20261018
