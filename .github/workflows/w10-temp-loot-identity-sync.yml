name: Temporary W10 adjusted identity artifact regeneration
on:
  push:
    branches:
      - codex/w10-loot-evidence-failclosed-20261019
    paths:
      - docs/W10-FAILCLOSED-LOOT-PURPOSE-2026-10-19.md
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w10-loot-evidence-failclosed-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Regenerate development artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.bootstrap.auto.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(W10): sync valid exact variant evidence runtime'
            git push origin HEAD:codex/w10-loot-evidence-failclosed-20261019
          fi
