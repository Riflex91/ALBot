name: Temporary configured 3shot regression and bundle sync
on:
  push:
    branches:
      - fix/20261021-configured-independent-3shot-rotation
    paths:
      - '.github/workflows/temp-configured-3shot-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261021-configured-independent-3shot-rotation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: User-configured 3shot realistic dispatch regression
        run: |
          node --test test/20261021-real-spawn-geometry-aimed-ranger.test.mjs test/20261020-shared-spawn-multi-farmer.test.mjs
      - name: Full offline regression and source build
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          npm test
      - name: Persist generated bundles
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync configured independent 3shot fix'
          git pull --rebase origin fix/20261021-configured-independent-3shot-rotation
          git push origin HEAD:refs/heads/fix/20261021-configured-independent-3shot-rotation
