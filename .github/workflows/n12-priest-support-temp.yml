name: Temporary N12 Cave Priest support bundle verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: n12-priest-support-temporary
  cancel-in-progress: true
jobs:
  verify-and-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/n12-cave-priest-support-step-20261020' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n12-cave-priest-support-step-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run Priest support and relevant Cave regressions
        run: node --test test/roadmap-n12-cave-priest-support-step.test.mjs test/roadmap-n12-cave-priest-healing.test.mjs test/roadmap-n12-cave-emergency-direct.test.mjs test/roadmap-n12-cave-direct-cohesion.test.mjs test/roadmap-n12-cave-cumulative-threat.test.mjs test/roadmap-n12-cave-defensive-basic.test.mjs
      - name: Complete offline regression suite
        run: npm test
      - name: Build runtime
        run: npm run build
      - name: Synchronize personal CODE runtime
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild standalone editor
        run: npm run build:editor
      - name: Verify runtime configuration parity
        run: node scripts/sync-personal-code.mjs --check
      - name: Commit only tracked runtime and editor artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo 'Build artifacts already synchronized.'
          else
            git commit -m 'build(N12): regenerate Priest support runtime and editor'
            git push origin HEAD:codex/n12-cave-priest-support-step-20261020
          fi
