name: Rebuild ALBot personal bundle for final fix
on:
  push:
    branches:
      - fix/farm-reunion-and-spawn-stability-20261018
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: node scripts/sync-personal-code.mjs --check
      - run: npm test
      - name: Commit personal bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js
          if ! git diff --staged --quiet; then
            git commit -m "build: resync personal bot.js after cross-realm and spawn safeguards"
            git push origin HEAD:fix/farm-reunion-and-spawn-stability-20261018
          fi
