name: Temporary W03 quote-bound funding build
on:
  push:
    branches:
      - codex/w03-market-quote-bound-funding-20261019
permissions:
  contents: write
jobs:
  verify-and-generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: W03 targeted market and bank regressions
        run: |
          node --test test/merchant-market-bank-funding.test.mjs test/merchant-market-reprobe.test.mjs test/roadmap-w06-finite-market-materials.test.mjs test/roadmap-w03-bank-gold-commitments.test.mjs
      - name: Build runtime, preserve personal configuration, rebuild editor
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
      - name: Commit generated comparison artifacts only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build(W03): regenerate runtime and editor with intact config"
            git push origin HEAD:codex/w03-market-quote-bound-funding-20261019
          fi
