name: Temporary G09 barter runtime artifact sync
on:
  push:
    branches:
      - codex/g09-explicit-single-item-swap-20261018
    paths:
      - .github/workflows/regen-albot-pr.yml
      - src/merchant/single-swap.mjs
      - src/main.mjs
      - src/merchant/controller.mjs
      - src/merchant/economy.mjs
      - editor/lib/schema.mjs
      - editor/lib/contract.mjs
      - scripts/build.mjs
      - test/roadmap-g09-single-swap.test.mjs
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'Riflex91/ALBot'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm test
      - run: npm run build:editor
      - name: Commit generated artifact preserving personal config
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync G09 bounded barter runtime preserving personal config"
            git push origin HEAD:codex/g09-explicit-single-item-swap-20261018
          fi
