name: TEMP W12 emergency creature proof runtime sync
on:
  push:
    branches: [roadmap/w12-cave-emergency-monster-evidence-20261022]
permissions: {contents: write}
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node --test test/roadmap-n12-cave-emergency-direct.test.mjs test/roadmap-n12-cave-direct-cohesion.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Commit generated runtime/editor artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u bot.js dist editor profiles
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize guarded Cave emergency runtime"
            git push origin "HEAD:roadmap/w12-cave-emergency-monster-evidence-20261022"
          fi
