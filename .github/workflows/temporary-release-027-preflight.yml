name: Temporary 0.27 release preflight and artifact sync
on:
  push:
    branches: [release/telemetry-runtime-027-20261021]
permissions:
  contents: write
jobs:
  linux-sync:
    if: ${{ github.repository == 'Riflex91/ALBot' && github.ref == 'refs/heads/release/telemetry-runtime-027-20261021' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build exact release candidate and sync personal CODE
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          npm run build:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          npm run build:konfigurator
          npm test
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/manifest.json dist/albot.settings.json dist/albot.bootstrap.auto.js editor/Bot-Werkstatt.html editor/albot.settings.json profiles/full-solo.json profiles/full-team.json
          if git diff --cached --quiet; then echo "Version bump generated no build delta" >&2;exit 1;fi
          git commit -m "build(release): align unsigned 0.27 candidate bytes [skip sync]"
          git push origin "HEAD:release/telemetry-runtime-027-20261021"
  windows-preflight:
    needs: linux-sync
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/telemetry-runtime-027-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify exact generated release candidate and signed prior channel
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/VERIFY-U01-U07.ps1
