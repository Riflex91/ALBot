name: Temporary N12 Cave retreat preparation verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: n12-cave-retreat-preparation-build
  cancel-in-progress: true
jobs:
  verify-and-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/n12-cave-retreat-prepare-20261020' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n12-cave-retreat-prepare-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Two-round Cave retreat and critical response regressions
        run: node --test test/roadmap-n12-cave-retreat-consensus.test.mjs test/roadmap-n12-cave-critical-response.test.mjs test/roadmap-n12-cave-critical-heal-triage.test.mjs test/roadmap-n12-cave-priest-healing.test.mjs
      - name: Full offline regression suite
        run: npm test
      - name: Build browser and headless runtime
        run: npm run build
      - name: Preserve personal CODE configuration
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild standalone editor
        run: npm run build:editor
      - name: Validate source and generated bundle parity
        run: node scripts/sync-personal-code.mjs --check
      - name: Commit tracked generated runtime only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo 'Artifacts already synchronized.'
          else
            git commit -m 'build(N12): sync two-round Cave retreat preparation runtime and editor'
            git push origin HEAD:codex/n12-cave-retreat-prepare-20261020
          fi
