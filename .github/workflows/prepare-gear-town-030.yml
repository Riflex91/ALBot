name: Prepare farmer gear and Town candidate 0.30
on:
  push:
    branches: [fix/farmer-gear-delivery-and-town-route-20261021]
permissions:
  contents: write
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/farmer-gear-delivery-and-town-route.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:bootstrap:auto
      - run: npm run check:bootstrap:auto
      - run: node scripts/verify-bootstrap-contract.mjs
      - run: node scripts/verify-bootstrap-channel.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit generated artifacts for full Linux/Windows PR verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json dist/albot.bootstrap.auto.js profiles/full-solo.json profiles/full-team.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(build): refresh approved 0.30 bootstrap comparison artifacts [generated]"
          git push origin HEAD:fix/farmer-gear-delivery-and-town-route-20261021
