name: Temporary W02-W04 reserve-floor artifacts
on:
  push:
    branches:
      - codex/w02-w04-explicit-floor-parity-20261020
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify reserve and staging tests
        run: |
          node --test test/roadmap-w04-bank-disposition.test.mjs test/roadmap-w02-bounded-stock.test.mjs test/roadmap-w02-bound-variant-purpose-reservations.test.mjs test/roadmap-w03-bank-partial-recovery.test.mjs
      - name: Build shared runtime and retain personal settings
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
      - name: Commit generated runtime and editor artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build(W02/W04): regenerate validated reserve-floor artifacts"
            git push origin HEAD:codex/w02-w04-explicit-floor-parity-20261020
          fi
