name: Temporary spawn geometry and aimed Ranger integration
on:
  push:
    branches:
      - fix/20261021-spawn-geometry-full-aimed-ranger
    paths:
      - '.github/workflows/temp-spawn-aimed-integration.yml'
permissions:
  contents: write
jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261021-spawn-geometry-full-aimed-ranger
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Replay real spawn and Ranger 3shot/5shot skill dispatch
        run: |
          node --test test/20261021-real-spawn-geometry-aimed-ranger.test.mjs test/20261020-shared-spawn-multi-farmer.test.mjs test/20261020-follower-bounded-spawn.test.mjs
      - name: Build and verify every regression
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          npm test
      - name: Commit only verified generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync verified geometry and multi-shot combat runtime'
          git pull --rebase origin fix/20261021-spawn-geometry-full-aimed-ranger
          git push origin HEAD:refs/heads/fix/20261021-spawn-geometry-full-aimed-ranger
