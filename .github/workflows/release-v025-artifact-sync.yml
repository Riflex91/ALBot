name: Temporary ALBot v025 bootstrap artifact synchronization
on:
  push:
    branches:
      - ci/release-v025-bootstrap-sync-20261021
    paths:
      - .github/workflows/release-v025-artifact-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/automatic-telemetry-v025-20261021
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build, rebase personal prefix and pinned auto-bootstrap
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          npm test
          npm run build:editor
      - name: Commit synchronized unsigned review artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist editor profiles
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync reviewed v025 source and bootstrap candidate"
          git push origin "HEAD:release/automatic-telemetry-v025-20261021"
