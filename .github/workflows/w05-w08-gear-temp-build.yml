name: Temporary W05-W08 gear evidence build
on:
  push:
    branches:
      - codex/w05-w08-gear-evidence-completeness-20261020
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: W05/W08 evidence and gear regression tests
        run: |
          node --test test/roadmap-w05-cross-role-fairness.test.mjs test/roadmap-w05-gear-refresh-integrity.test.mjs test/priest-unarmed-starter-gear.test.mjs test/roadmap-w07-operating-gear.test.mjs
      - name: Build shared runtime and editor, check signed bootstrap and personal code
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
      - name: Commit generated runtime and editor artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build(W05/W08): regenerate verified gear evidence runtime/editor"
            git push origin HEAD:codex/w05-w08-gear-evidence-completeness-20261020
          fi
