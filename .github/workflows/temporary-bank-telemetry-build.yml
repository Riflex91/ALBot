name: Temporary bank telemetry artifact verification
on:
  push:
    branches: [fix/bank-telemetry-short-visits-20261021]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Targeted telemetry regression tests
        run: node --test konfigurator/test/automatic-telemetry.test.mjs konfigurator/test/telemetry-bank-events.test.mjs
      - name: Rebuild source-derived assets
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          npm run build:bootstrap:auto
      - name: Full test suite
        run: npm test
      - name: Commit only generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json dist/albot.bootstrap.auto.js editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync artifacts after bank telemetry observation fix"
            git push origin HEAD:refs/heads/fix/bank-telemetry-short-visits-20261021
          fi
