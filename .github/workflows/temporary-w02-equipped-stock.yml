name: Temporary W02 equipped stock 0.54 candidate synchronization
on:
  push:
    branches: [roadmap/w02-w10-exact-equipped-stock-20261024]
permissions:
  contents: write
jobs:
  generate:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:bootstrap:auto
      - run: npm run build:editor
      - run: npm test
      - name: Commit all generated artifacts if fully tested
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.bootstrap.auto.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html editor/albot.settings.json
          if ! git diff --cached --quiet; then
            git commit -m "build(candidate): synchronize 0.54 W02 equipment and current farmer/accessory runtime"
            git push origin HEAD:roadmap/w02-w10-exact-equipped-stock-20261024
          fi
