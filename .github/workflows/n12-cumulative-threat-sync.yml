name: Temporary N12 cumulative Cave threat artifact builder
on:
  push:
    branches:
      - codex/n12-cave-multi-threat-20261020
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n12-cave-multi-threat-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test cumulative threat and existing Cave defense
        run: node --test test/roadmap-n12-cave-cumulative-threat.test.mjs test/roadmap-n12-cave-defensive-basic.test.mjs
      - name: Full offline test suite
        run: npm test
      - name: Build runtime
        run: npm run build
      - name: Preserve personal configuration and sync CODE artifact
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild editor
        run: npm run build:editor
      - name: Verify generated parity
        run: node scripts/sync-personal-code.mjs --check
      - name: Commit only tracked generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo 'Generated files already synchronized.'
          else
            git commit -m 'build(N12): sync cumulative Cave threat runtime and editor'
            git push origin HEAD:codex/n12-cave-multi-threat-20261020
          fi
