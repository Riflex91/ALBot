name: Temporary N12 Cave retreat watchdog build
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: n12-cave-retreat-watchdog-build
  cancel-in-progress: true
jobs:
  verify-and-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/n12-cave-retreat-abort-arrival-20261020' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n12-cave-retreat-abort-arrival-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cave retreat watchdog, quorum and survival regression tests
        run: node --test test/roadmap-n12-cave-retreat-consensus.test.mjs test/roadmap-n12-cave-critical-response.test.mjs test/roadmap-n12-cave-critical-heal-triage.test.mjs test/roadmap-n12-cave-priest-healing.test.mjs
      - name: Entire offline regression suite
        run: npm test
      - name: Rebuild browser and headless runtime
        run: npm run build
      - name: Preserve personal CODE runtime prefix
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild standalone editor
        run: npm run build:editor
      - name: Validate source/runtime/editor parity
        run: node scripts/sync-personal-code.mjs --check
      - name: Commit regenerated tracked runtime artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo 'No differences in generated runtime/editor.'
          else
            git commit -m 'build(N12): regenerate Cave retreat abort/arrival runtime and editor'
            git push origin HEAD:codex/n12-cave-retreat-abort-arrival-20261020
          fi
