name: TEMP prepare ALBot 0.39 signed candidate inputs
on:
  push:
    branches: [codex/release-039-team-recovery-20261023]
permissions:
  contents: write
concurrency:
  group: prepare-039-release-assets
  cancel-in-progress: false
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'prepare(runtime):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Source/runtime match and full regressions
        run: |
          node scripts/sync-personal-code.mjs --check
          npm test
      - name: Commit 0.39 reproducible browser/editor assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist/ editor/Bot-Werkstatt.html editor/albot.settings.json profiles/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "prepare(runtime): synchronize ALBot 0.39 browser/headless/editor assets"
          git push origin HEAD:codex/release-039-team-recovery-20261023
