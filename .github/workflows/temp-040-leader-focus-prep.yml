name: TEMP prepare ALBot leader-focus correction
on:
  push:
    branches: [codex/040-leader-focus-support-20261023]
permissions:
  contents: write
concurrency:
  group: albot-040-leader-focus-prep
  cancel-in-progress: false
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'prepare(runtime):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Full source and generated runtime verification
        run: |
          node scripts/sync-personal-code.mjs --check
          npm test
      - name: Commit exact tested generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist/ editor/Bot-Werkstatt.html editor/albot.settings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "prepare(runtime): synchronize leader-focus browser and headless assets"
          git push origin HEAD:codex/040-leader-focus-support-20261023
