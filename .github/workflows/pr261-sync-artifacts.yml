name: PR 261 artifact synchronization (temporary)
on:
  push:
    branches:
      - codex/w10-stock-quantity-proof-20261020-1011
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-artifacts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: codex/w10-stock-quantity-proof-20261020-1011
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Verify synchronized personal artifact and tests
        run: |
          node scripts/sync-personal-code.mjs --check
          npm test
      - name: Commit only tracked generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo 'Generated artifacts already synchronized'
          else
            git commit -m 'build: synchronize PR 261 runtime and editor artifacts'
            git push origin HEAD:codex/w10-stock-quantity-proof-20261020-1011
          fi
