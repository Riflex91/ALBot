name: Prepare gear delivery 035 artifacts
on:
  push:
    branches: [fix/gear-heartbeat-stock-delivery-035-20261022]
permissions:
  contents: write
concurrency:
  group: prepare-gear-035
  cancel-in-progress: false
jobs:
  verify-build:
    if: "!startsWith(github.event.head_commit.message, 'build(gear035):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/gear-delivery-035-regressions.test.mjs test/heartbeat-material-progress.test.mjs test/transport-diagnostics.test.mjs test/priest-unarmed-starter-gear.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: npm run build:konfigurator
      - run: npm run build:bootstrap:auto
      - run: npm run check:bootstrap:auto
      - run: node scripts/verify-bootstrap-contract.mjs
      - run: npm test
      - name: Commit source-matched review bundles
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/Bot-Werkstatt.html editor/albot.settings.json profiles/ konfigurator/public/
          if ! git diff --cached --quiet; then
            git commit -m 'build(gear035): synchronize verified artifacts'
            git push origin HEAD:fix/gear-heartbeat-stock-delivery-035-20261022
          fi
