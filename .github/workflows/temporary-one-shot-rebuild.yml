name: Temporary ALBot One-Shot PR Build Sync
on:
  push:
    branches:
      - fix/20261020-independent-one-shot-farmers
    paths:
      - '.github/workflows/temporary-one-shot-rebuild.yml'
permissions:
  contents: write
concurrency:
  group: albot-one-shot-artifact-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild personal-code comparison artifact
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          node --test test/20261020-independent-farmer-one-shot.test.mjs
      - name: Commit only generated artifacts
        shell: bash
        run: |
          git add -u bot.js dist
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: sync one-shot AoE runtime artifacts'
          git pull --rebase origin fix/20261020-independent-one-shot-farmers
          git push origin HEAD:refs/heads/fix/20261020-independent-one-shot-farmers
