# One-shot W03 bank store verification; remove after passing.
name: W03 temporary bank-store verification
on:
  push:
    branches: [codex/w00-w01-readonly-disposition-20261018]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w00-w01-readonly-disposition-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Sync personal bot and verify full config remains identical
        shell: bash
        run: |
          node scripts/sync-personal-code.mjs --write
          node --input-type=module <<'EOF'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const old=execFileSync('git',['show','HEAD:bot.js'],{encoding:'utf8'});
          const now=readFileSync('bot.js','utf8');
          const config=s=>{
            const p=s.indexOf('globalThis.ALBotConfig=');
            const q=s.indexOf('/* ALBot ',p);
            if(p<0||q<0)throw Error('Personal config boundary missing');
            return JSON.parse(s.slice(p+'globalThis.ALBotConfig='.length,q).trim().replace(/;\s*$/,''));
          };
          const a=config(old),b=config(now);
          if(JSON.stringify(a)!==JSON.stringify(b))
            throw Error('Personal config changed during bundle sync');
          if(b.farming.hpBelow!==0.7||b.farming.pullHp!==0.75||
             b.farming.avoidOthers!==true||b.world.risk!=='aggressive')
            throw Error('Authorized owner/risk settings changed');
          console.log('Full personal JSON config identical before/after sync');
          EOF
      - shell: bash
        run: |
          if git diff --quiet -- bot.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js
          git commit -m "build(W03): synchronize durable bank-store runtime"
          git push origin HEAD:codex/w00-w01-readonly-disposition-20261018
  linux-verification:
    needs: [sync]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w00-w01-readonly-disposition-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --check
      - run: npm test
      - run: npm run build:editor
      - run: node --check dist/albot.js
      - shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const code=fs.readFileSync('dist/albot.js');
          const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));
          const sha256=crypto.createHash('sha256').update(code).digest('hex');
          if(code.length>1048576||m.bytes!==code.length||m.sha256!==sha256)
            throw new Error('Bundle or manifest integrity failed');
          console.log(JSON.stringify({bytes:code.length,sha256,version:m.version}));
          EOF
  windows-verification:
    needs: [sync]
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w00-w01-readonly-disposition-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - shell: pwsh
        run: ./scripts/VERIFY-U01-U07.ps1
