name: Temporary N12 bounded direct Cave cohesion build
on:
  push:
    branches:
      - codex/n12-cave-direct-cohesion-20261020
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n12-cave-direct-cohesion-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run new Cave regressions first
        run: node --test test/roadmap-n12-cave-direct-cohesion.test.mjs
      - name: Full offline regression suite
        run: npm test
      - name: Build runtime
        run: npm run build
      - name: Synchronize existing personal CODE prefix
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild editor
        run: npm run build:editor
      - name: Confirm runtime parity
        run: node scripts/sync-personal-code.mjs --check
      - name: Commit only tracked generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m 'build(N12): sync direct Cave cohesion runtime and editor'
            git push origin HEAD:codex/n12-cave-direct-cohesion-20261020
          fi
