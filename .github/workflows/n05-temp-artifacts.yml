name: Temporary N05 branch artifact regeneration
on:
  push:
    branches:
      - codex/n05-fresh-spawn-pressure-20261019
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build runtime, retain personal config, and regenerate editor
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
      - name: Targeted fresh-pressure regressions
        run: |
          node --test test/roadmap-n05-fresh-pressure.test.mjs test/roadmap-team-spawn-switch.test.mjs
      - name: Commit only generated comparison artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build(N05): regenerate runtime, personal parity and editor"
            git push origin HEAD:codex/n05-fresh-spawn-pressure-20261019
          fi
