name: One-shot regenerate ALBot bootstrap artifacts
on:
  push:
    branches: [fix/greenjr-bank-gold-bootstrap-20261019]
permissions:
  contents: write
jobs:
  regenerate:
    if: "!startsWith(github.event.head_commit.message, 'build(artifacts):')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/greenjr-bank-gold-bootstrap-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: npm test
      - name: Commit generated runtime and personal comparison artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist/ profiles/ editor/
          if git diff --cached --quiet; then
            echo "All generated files already synchronized"
            exit 0
          fi
          git commit -m "build(artifacts): synchronize runtime and bootstrap review"
          git push origin HEAD:fix/greenjr-bank-gold-bootstrap-20261019
