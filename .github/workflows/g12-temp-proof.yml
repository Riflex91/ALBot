name: Temporary G12 destat quantity proof
on:
  push:
    branches:
      - codex/g12-verified-destat-quantities-20261020
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: G12 and W02 physical source and receipt tests
        run: |
          node --test test/roadmap-g12-destat.test.mjs test/roadmap-w02-bounded-stock.test.mjs test/roadmap-n01-stat-tailoring.test.mjs test/roadmap-w02-bound-variant-purpose-reservations.test.mjs
      - name: Build runtime, editor, retain config and verify signed channel
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
      - name: Commit generated runtime and editor only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build(G12): regenerate runtime and editor with quantity proof"
            git push origin HEAD:codex/g12-verified-destat-quantities-20261020
          fi
