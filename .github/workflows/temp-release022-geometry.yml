name: Temporary ALBot 0.22 complete spawn and multi-shot release
on:
  push:
    branches:
      - release/20261021-geometry-aimed-v022
    paths:
      - '.github/workflows/temp-release022-geometry.yml'
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-geometry-aimed-v022
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full source-and-release regression Linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
          npm run build:editor
          node --test test/20261021-real-spawn-geometry-aimed-ranger.test.mjs
          npm test
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-geometry-aimed-v022
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full native Windows verification with unchanged V2 code
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm.cmd run build
          if($LASTEXITCODE -ne 0){throw 'Source build failed'}
          node scripts/sync-personal-code.mjs --write
          if($LASTEXITCODE -ne 0){throw 'Personal code sync failed'}
          npm.cmd run build:bootstrap:auto
          if($LASTEXITCODE -ne 0){throw 'Auto V2 build failed'}
          ./scripts/VERIFY-U01-U07.ps1
          if($LASTEXITCODE -ne 0){throw 'Windows verification failed'}
  stage:
    needs: [linux,windows]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-geometry-aimed-v022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild exact tested artifacts
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
          npm run build:editor
          npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit only generated, source-equivalent code artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: source-equivalent ALBot 0.22 geometry and multi-shot release'
          git pull --rebase origin release/20261021-geometry-aimed-v022
          git push origin HEAD:refs/heads/release/20261021-geometry-aimed-v022
