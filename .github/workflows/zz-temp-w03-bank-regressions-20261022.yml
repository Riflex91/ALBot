name: TEMP W03 bank journal all regression sync
on:
  push:
    branches: [roadmap/w03-complete-bank-journal-observations-20261022]
permissions: {contents: write}
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node --test test/economy.test.mjs test/bank-observed-length.test.mjs test/roadmap-w04-reclaim-recovery.test.mjs test/roadmap-w03-single-bank-recovery.test.mjs test/roadmap-w03-single-bank-store-recovery.test.mjs test/roadmap-w03-bank-swap-recovery.test.mjs test/roadmap-w03-bank-partial-recovery.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Commit aligned runtime after comprehensive bank regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u bot.js dist editor profiles
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize guarded compact bank receipts"
            git push origin "HEAD:roadmap/w03-complete-bank-journal-observations-20261022"
          fi
