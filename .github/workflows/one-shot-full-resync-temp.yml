name: Temporary one-shot complete artifact resync
on:
  push:
    branches: [fix/20261020-independent-one-shot-farmers]
permissions:
  contents: write
concurrency:
  group: one-shot-complete-resync
  cancel-in-progress: true
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261020-independent-one-shot-farmers
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build, synchronize and verify personalized source
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          npm test
      - name: Commit exact tracked source-aligned artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if ! git diff --cached --quiet; then
            git commit -m "build(one-shot): resynchronize verified source, runtime and editor"
            git push origin HEAD:fix/20261020-independent-one-shot-farmers
          fi
