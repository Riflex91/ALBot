name: TEMP prepare signed 0.36 runtime candidate
on:
  push:
    branches: [release/prepare-036-candidate-20261022]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:bootstrap:auto
      - run: npm run build:editor
      - run: npm run build:konfigurator
      - name: Verify unchanged personal settings and auto bootstrap
        run: |
          node scripts/sync-personal-code.mjs --check
          npm run check:bootstrap:auto
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u bot.js dist editor profiles
          if ! git diff --cached --quiet; then
            git commit -m "build: sync 0.36 signed candidate runtime"
            git push origin "HEAD:release/prepare-036-candidate-20261022"
          fi
