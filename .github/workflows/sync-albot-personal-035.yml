name: Sync personal ALBot CODE bundle (PR35)
on:
  push:
    branches:
      - codex/albot-production-surplus-20261013
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/codex/albot-production-surplus-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/albot-production-surplus-20261013
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - name: Commit generated bot.js to this feature branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild personal bot.js from tested 0.10.3 runtime"
            git push origin HEAD:codex/albot-production-surplus-20261013
          fi
