name: Refresh ALBot proposed runtime artifacts
on:
  push:
    branches:
      - fix/explicit-market-pricing-team-defense-20261022
    paths:
      - 'src/**'
      - 'editor/lib/schema.mjs'
      - 'scripts/build.mjs'
      - '.github/workflows/sync-proposed-runtime.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use latest development branch before generating outputs
        run: git pull --ff-only origin fix/explicit-market-pricing-team-defense-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: npm test
      - name: Commit generated review artifacts on the same development branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/explicit-market-pricing-team-defense-20261022'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.js dist editor/Bot-Werkstatt.html profiles
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize reviewed runtime and editor artifacts'
            git push origin HEAD:refs/heads/fix/explicit-market-pricing-team-defense-20261022
          fi
