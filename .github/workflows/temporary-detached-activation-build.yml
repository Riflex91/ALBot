name: Temporary detached candidate artifact synchronization (0.54)
on:
  push:
    branches:
      - feat/config-sync-detached-activation-dryrun-20261024
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && github.repository == 'Riflex91/ALBot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate detached Full-v1 candidate from actual signer fixtures
        run: node --test konfigurator/test/config-sync-detached-candidate.test.mjs
      - name: Build and re-sync candidate without mutating personal CODE prefix
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          npm test
      - name: Commit tested generated artifacts only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bot.js dist/albot.bootstrap.auto.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html editor/albot.settings.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(candidate): synchronize unsigned 0.54 detached activation runtime'
            git push origin HEAD:feat/config-sync-detached-activation-dryrun-20261024
          fi
