name: Temporary ALBot PR main reconciliation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/w02-w04-physical-operating-stock-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge updated main before regenerating conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X theirs origin/main
          # Source files must never be silently resolved with -X theirs.
          if git ls-files -u | grep .; then
            echo "Unresolved merge conflict: stop." >&2
            exit 1
          fi
      - name: Build complete source-aligned runtime/editor before merge commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/manifest.json dist/albot.settings.json editor/Bot-Werkstatt.html editor/albot.settings.json profiles/full-solo.json profiles/full-team.json
          git commit -m "build(W02/W04): integrate latest main and rebuild shared runtime artifacts"
          git push origin "HEAD:${{ github.head_ref }}"
