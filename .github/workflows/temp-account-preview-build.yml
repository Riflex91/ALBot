name: Temporary ALBot PR artifact generation
on:
  push:
    branches:
      - codex/albot-configurator-account-stock-preview-20261020
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild shared runtime and preserve the personal profile
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
      - name: Commit only generated comparison artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json profiles/full-solo.json profiles/full-team.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh generated ALBot artifacts for account preview"
            git push origin HEAD:codex/albot-configurator-account-stock-preview-20261020
          fi
