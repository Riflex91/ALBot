name: Temporary ALBot 0.20 build and verification
on:
  push:
    branches:
      - release/20261020-follower-fix-v020
    paths:
      - '.github/workflows/temp-release020-preflight.yml'
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261020-follower-fix-v020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify 0.20 source and V2 loader
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
          npm run build:editor
          npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261020-follower-fix-v020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Windows exact runtime and bootstrap check
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm.cmd run build
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          node scripts/sync-personal-code.mjs --write
          if($LASTEXITCODE -ne 0){throw 'CODE sync failed'}
          npm.cmd run build:bootstrap:auto
          if($LASTEXITCODE -ne 0){throw 'bootstrap rebuild failed'}
          ./scripts/VERIFY-U01-U07.ps1
          if($LASTEXITCODE -ne 0){throw 'Windows verification failed'}
  stage:
    needs: [linux,windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261020-follower-fix-v020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild exact tested files
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          npm test
      - name: Commit exact source-derived release artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: prepare 0.20 personal bot and V2 bootstrap without changing config'
          git pull --rebase origin release/20261020-follower-fix-v020
          git push origin HEAD:refs/heads/release/20261020-follower-fix-v020
