name: Temporary W04 local-pack proof
on:
  push:
    branches: [codex/w04-cross-pack-size-proof-20261020]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Targeted W04 and recovery regression tests
        run: |
          node --test test/roadmap-w04-bank-disposition.test.mjs test/roadmap-w03-bank-partial-recovery.test.mjs test/roadmap-w03-single-bank-recovery.test.mjs test/roadmap-w04-bank-journal-collision.test.mjs
      - name: Regenerate runtime and editor, verify retained config and signed release
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
      - name: Commit regenerated comparison artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build(W04): regenerate local-pack bound runtime and editor"
            git push origin HEAD:codex/w04-cross-pack-size-proof-20261020
          fi
