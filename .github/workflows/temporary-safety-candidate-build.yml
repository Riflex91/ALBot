name: Temporary ALBot candidate artifact synchronization
on:
  push:
    branches: [codex/combat-safety-hazard-route-20261020]
permissions:
  contents: write
jobs:
  synchronized-build:
    if: "!contains(github.event.head_commit.message, '[skip generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/combat-safety-hazard-route-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: node scripts/sync-personal-code.mjs --check
      - name: Commit only deterministic generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/manifest.json editor/Bot-Werkstatt.html
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize safety runtime artifacts [skip generated]"
            git push origin HEAD:codex/combat-safety-hazard-route-20261020
          fi
