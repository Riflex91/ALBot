name: Temporary W02-W04 main reconciliation v0221
on:
  push:
    branches: [codex/w02-w04-physical-operating-stock-20261021]
permissions:
  contents: write
jobs:
  reconcile:
    if: ${{ github.repository == 'Riflex91/ALBot' && github.ref == 'refs/heads/codex/w02-w04-physical-operating-stock-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrate current main and rebuild 0.22.1-compatible artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X theirs origin/main
          if git ls-files -u | grep .; then
            echo "Unresolved conflict" >&2
            exit 1
          fi
          npm ci --ignore-scripts
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          npm run build:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/manifest.json dist/albot.settings.json dist/albot.bootstrap.auto.js editor/Bot-Werkstatt.html editor/albot.settings.json profiles/full-solo.json profiles/full-team.json
          git commit -m "build(W02/W04): reconcile ALBot 0.22.1 main and regenerate runtime/editor artifacts"
          git push origin "HEAD:codex/w02-w04-physical-operating-stock-20261021"
