name: Rebuild signed 0.53 review artifacts
on:
  push:
    branches:
      - release/pin-signed-053-combat-20261024
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild and verify signed source parity
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --check
          npm run check:bootstrap:auto
          npm run verify:release
          npm run build:bootstrap
          npm run build:editor
      - name: Full offline regression tests
        run: npm test
      - name: Commit derived review artifacts only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/albot.js dist/albot.package.json dist/albot.settings.json dist/manifest.json dist/albot.bootstrap.js profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(release): synchronize 0.53 signed review artifacts"
          git push origin HEAD:release/pin-signed-053-combat-20261024
