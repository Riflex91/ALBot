name: Temporary source to personal-bundle sync for combat PR
on:
  push:
    branches: [fix/validated-team-heal-potion-rescue-20261018]
permissions:
  contents: write
jobs:
  sync:
    if: "!startsWith(github.event.head_commit.message, 'build: sync combat artifacts')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validated-team-heal-potion-rescue-20261018
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and preserve the personal configuration
        shell: bash
        run: |
          cp bot.js /tmp/albot-personal-before.js
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          function config(file) {
            const s=fs.readFileSync(file,'utf8'),a=s.indexOf('globalThis.ALBotConfig='),b=s.indexOf('/* ALBot ',a);
            if(a<0||b<0)throw Error('Personal configuration boundaries missing');
            return s.slice(a,b);
          }
          if(config('/tmp/albot-personal-before.js')!==config('bot.js'))
            throw Error('Personal ALBotConfig changed');
          EOF
      - name: Full regression tests
        run: npm test
      - name: Sync generated artifacts to the PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync combat artifacts"
          git push origin HEAD:fix/validated-team-heal-potion-rescue-20261018
