name: Temporary W05 isolated offline tests
on:
  push:
    branches:
      - codex/w05-realm-fresh-gear-fairness-rebased-20261019
    paths:
      - .github/workflows/w05-temp-offline-tests.yml
permissions:
  contents: read
jobs:
  verify-w05-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --check
      - run: npm test
      - run: npm run build:editor
