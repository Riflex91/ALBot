name: ALBot offline verification
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build shared browser/headless runtime
        run: npm run build
      - name: Verify published bot.js matches source build and personal configuration
        run: node scripts/sync-personal-code.mjs --check
      - name: Verify documented bootstrap target and version contract
        run: node scripts/verify-bootstrap-contract.mjs
      - name: Verify signed in-game release manifest and runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-bootstrap-channel.mjs
      - name: Full offline tests
        run: npm test
      - name: Build editor package
        run: npm run build:editor
      - name: Verify and package Cloudflare-ready Konfigurator
        run: |
          npm run build:konfigurator
          node --check konfigurator/worker/index.mjs
          node --check konfigurator/public/app.mjs
          node --check konfigurator/public/policy.mjs
          node konfigurator/scripts/verify-public-assets.mjs
      - name: Syntax, bootstrap size, and manifest integrity
        shell: bash
        run: |
          node --check dist/albot.js
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {BOOTSTRAP_RUNTIME_LIMIT,SLOT_LIMIT} from './editor/lib/contract.mjs';
          const code=fs.readFileSync('dist/albot.js');
          const runtime=fs.readFileSync('dist/albot.runtime.js');
          const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));
          const h=crypto.createHash('sha256').update(code).digest('hex');
          if(runtime.length>BOOTSTRAP_RUNTIME_LIMIT)throw new Error('Bootstrap runtime exceeds 8 MiB');
          if(code.length>BOOTSTRAP_RUNTIME_LIMIT+SLOT_LIMIT)throw new Error('Bootstrap review artifact exceeds its wrapper allowance');
          if(m.bytes!==code.length||m.sha256!==h)throw new Error('Manifest differs from shared bundle');
          if(m.runtimeBytes!==runtime.length)throw new Error('Manifest differs from runtime bytes');
          console.log(JSON.stringify({bytes:code.length,runtimeBytes:runtime.length,sha256:h,version:m.version}));
          EOF
      - name: Archive generated offline-review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: albot-u01-u07-offline-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/albot.js
            dist/albot.runtime.js
            dist/albot.package.json
            dist/albot.settings.json
            dist/manifest.json
            editor/Bot-Werkstatt.html
            editor/albot.settings.json
            profiles/full-solo.json
            profiles/full-team.json
  windows-verification:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run the exact Windows verification script
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/VERIFY-U01-U07.ps1
