name: TEMP W10 W13 artifact synchronization
on:
  push:
    branches:
      - roadmap/w10-w13-chest-source-proof-20261022
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/roadmap-w10-w13-own-loot-receipts.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Commit source-aligned generated runtime artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u bot.js dist editor profiles
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize W10 W13 runtime and editor"
            git push origin "HEAD:roadmap/w10-w13-chest-source-proof-20261022"
          fi
