name: Temporary N12 coordinated Cave multi-aggro validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: n12-cave-multi-focus-build
  cancel-in-progress: true
jobs:
  rebuild-and-prove:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/n12-cave-multi-aggro-focus-20261020' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n12-cave-multi-aggro-focus-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regression tests for shared multi-aggro focus
        run: node --test test/roadmap-n12-cave-multi-aggro-focus.test.mjs test/roadmap-n12-cave-cumulative-threat.test.mjs test/roadmap-n12-cave-defensive-basic.test.mjs test/roadmap-n12-cave-priest-healing.test.mjs test/roadmap-n12-cave-priest-support-step.test.mjs
      - name: Run complete offline tests
        run: npm test
      - name: Build current browser and headless artifacts
        run: npm run build
      - name: Preserve personal bot code prefix
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild editor
        run: npm run build:editor
      - name: Verify generated bundle parity
        run: node scripts/sync-personal-code.mjs --check
      - name: Commit only changed generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo 'Generated artifacts already aligned.'
          else
            git commit -m 'build(N12): regenerate coordinated Cave threat runtime and editor'
            git push origin HEAD:codex/n12-cave-multi-aggro-focus-20261020
          fi
