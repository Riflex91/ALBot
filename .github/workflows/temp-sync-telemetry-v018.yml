name: Build opt-in telemetry release candidate (temporary)
on:
  push:
    branches:
      - feat/konfigurator-optin-runtime-v018-20261020
permissions:
  contents: write
jobs:
  synchronize:
    if: "!startsWith(github.event.head_commit.message, 'build(telemetry):')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/konfigurator-optin-runtime-v018-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build candidate
        run: npm run build
      - name: Run offline tests before artifact sync
        run: npm test
      - name: Synchronize personal code without touching settings
        run: node scripts/sync-personal-code.mjs --write
      - name: Build classic editor
        run: npm run build:editor
      - name: Verify exact personal-code bytes
        run: node scripts/sync-personal-code.mjs --check
      - name: Synchronize ONLY checked build artifacts on candidate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist editor profiles
          if git diff --cached --quiet; then
            echo "No candidate artifact changes"
            exit 0
          fi
          git commit -m "build(telemetry): synchronize unsigned v0.18 candidate artifacts"
          git push origin HEAD:feat/konfigurator-optin-runtime-v018-20261020
