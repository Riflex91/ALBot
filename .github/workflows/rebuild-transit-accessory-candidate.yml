name: One-shot ALBot transit/accessory candidate rebuild
on:
  push:
    branches:
      - codex/fix-farmer-transit-accessory-20261024
permissions:
  contents: write
jobs:
  rebuild:
    if: startsWith(github.event.head_commit.message, 'build(request):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: npm run build:konfigurator
      - run: npm run check:bootstrap:auto
      - name: Commit reviewed generated candidates without signing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist editor konfigurator
          if ! git diff --cached --quiet; then
            git commit -m "build(candidate): sync transit and accessory fixes [skip ci]"
            git push origin HEAD:codex/fix-farmer-transit-accessory-20261024
          fi
