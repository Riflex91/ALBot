name: Candidate version sync 0.10.12
on:
  push:
    branches: [codex/version-bump-01012-20261019]
permissions:
  contents: write
jobs:
  build-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/version-bump-01012-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build versioned runtime and editor
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
      - name: Verify version, preserved configuration and tests
        run: |
          node scripts/sync-personal-code.mjs --check
          npm test
          npm run check:bootstrap:auto
      - name: Commit regenerated artifacts (without changing personal configuration)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist editor/Bot-Werkstatt.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore(build): sync 0.10.12-candidate generated runtime and personal artifact'
            git push origin HEAD:codex/version-bump-01012-20261019
          fi
