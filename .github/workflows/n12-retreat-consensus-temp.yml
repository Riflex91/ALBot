name: Temporary N12 Cave retreat consensus build
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: n12-cave-retreat-consensus-build
  cancel-in-progress: true
jobs:
  verify-and-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/n12-cave-retreat-consensus-20261020' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n12-cave-retreat-consensus-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Three-client Cave consensus and old Cave guards
        run: node --test test/roadmap-n12-cave-retreat-consensus.test.mjs test/roadmap-n12-cave-critical-response.test.mjs test/roadmap-n12-cave-critical-heal-triage.test.mjs test/roadmap-n12-cave-emergency-direct.test.mjs test/roadmap-n12-cave-direct-cohesion.test.mjs
      - name: Complete offline suite
        run: npm test
      - name: Rebuild ALBot runtime
        run: npm run build
      - name: Retain personal CODE settings
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild editor
        run: npm run build:editor
      - name: Validate generated runtime and config parity
        run: node scripts/sync-personal-code.mjs --check
      - name: Commit only generated tracked artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then
            echo 'No artifact differences.'
          else
            git commit -m 'build(N12): synchronize Cave retreat consensus runtime and editor'
            git push origin HEAD:codex/n12-cave-retreat-consensus-20261020
          fi
