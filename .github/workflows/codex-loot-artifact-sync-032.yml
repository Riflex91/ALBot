name: Build ALBot 0.32 candidate review
on:
  push:
    branches:
      - codex/loot-backlog-recovery-032-20261021
    paths:
      - .github/workflows/codex-loot-artifact-sync-032.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:bootstrap:auto
      - run: npm test
      - name: Commit build artifacts on review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/albot.bootstrap.auto.js dist/manifest.json profiles/full-solo.json profiles/full-team.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(loot): synchronize 0.32.0 candidate review artifacts"
          git push origin HEAD:codex/loot-backlog-recovery-032-20261021
