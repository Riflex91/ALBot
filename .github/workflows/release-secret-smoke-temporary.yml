name: Temporary signing secret smoke test (no publication)
on:
  push:
    branches: [codex/w00-w01-readonly-disposition-20261018]
    paths:
      - .github/workflows/release-secret-smoke-temporary.yml
permissions:
  contents: read
jobs:
  offline-signing-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w00-w01-readonly-disposition-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run verify:release
      - name: Sign next manifest with GitHub secret only in temporary runner
        shell: bash
        env:
          ALBOT_RELEASE_SIGNING_KEY_PEM: ${{ secrets.ALBOT_RELEASE_SIGNING_KEY_PEM }}
        run: |
          if [ -z "$ALBOT_RELEASE_SIGNING_KEY_PEM" ]; then
            echo "ALBOT_RELEASE_SIGNING_KEY_PEM is unavailable"
            exit 1
          fi
          npm run sign:release
          npm run verify:release
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const m=JSON.parse(fs.readFileSync('dist/albot.release.json','utf8'));
          const bytes=fs.readFileSync('dist/albot.runtime.js');
          if(m.sequence!==2||m.bytes!==bytes.byteLength||
             m.sha256!==crypto.createHash('sha256').update(bytes).digest('hex'))
            throw Error('Ephemeral next release does not match compiled runtime');
          console.log('Ephemeral signing succeeded; no files are published');
          EOF
      - name: Assert pinned bootstrap and tracked settings were not changed
        shell: bash
        run: |
          test -z "$(git status --porcelain -- bot.js release/public-key.json dist/albot.bootstrap.auto.js)"
          echo "Signing test finished without deployment or branch push"
