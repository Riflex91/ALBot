name: Temporary 0.22.1 configured Ranger 3shot release
on:
  push:
    branches:
      - release/20261021-configured-3shot-v0221
    paths:
      - '.github/workflows/temp-v0221-signable.yml'
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-configured-3shot-v0221
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify signable runtime and original V2 contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
          npm run build:editor
          node --test test/20261021-real-spawn-geometry-aimed-ranger.test.mjs
          npm test
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-configured-3shot-v0221
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native Windows offline verification with unmodified loader
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm.cmd run build
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          node scripts/sync-personal-code.mjs --write
          if($LASTEXITCODE -ne 0){throw 'Sync failed'}
          npm.cmd run build:bootstrap:auto
          if($LASTEXITCODE -ne 0){throw 'V2 bootstrap check failed'}
          ./scripts/VERIFY-U01-U07.ps1
          if($LASTEXITCODE -ne 0){throw 'Windows verification failed'}
  stage:
    needs: [linux,windows]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-configured-3shot-v0221
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Materialize fully verified 0.22.1 release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          npm test
      - name: Commit only generated bundles after full success
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: synchronize verified ALBot 0.22.1 bundles'
          git pull --rebase origin release/20261021-configured-3shot-v0221
          git push origin HEAD:refs/heads/release/20261021-configured-3shot-v0221
