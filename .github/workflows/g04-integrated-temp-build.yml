name: Temporary G04 integrated artifact generation
on:
  push:
    branches:
      - codex/g04-integrated-main-20261019
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify independently signed release and current snapshot
        run: node scripts/verify-bootstrap-channel.mjs
      - name: Build runtime and comparison/editor artifacts without config edits
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
      - name: Test G04, travel and priest regression
        run: |
          node --test test/roadmap-g04-group-hop-cost.test.mjs test/travel-economics.test.mjs test/home-realm-return.test.mjs test/server-hop-lifecycle.test.mjs test/farmer-monsterhunt-town-shortcut.test.mjs
      - name: Commit only regenerated comparison artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build(G04): integrate current main runtime and editor artifacts"
            git push origin HEAD:codex/g04-integrated-main-20261019
          fi
