name: Temporary candidate artifact synchronization
on:
  push:
    branches: [fix/live-041-team-merchant-hunt-20261024]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: npm test
      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html editor/albot.settings.json
          if ! git diff --cached --quiet; then
            git commit -m "build(candidate): regenerate 0.42 shared artifacts"
            git push origin HEAD:fix/live-041-team-merchant-hunt-20261024
          fi
