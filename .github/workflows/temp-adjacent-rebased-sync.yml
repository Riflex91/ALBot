name: Temporary adjacent spawn current main source validation
on:
  push:
    branches:
      - fix/20261021-adjacent-spawns-rebased-current-main
    paths:
      - '.github/workflows/temp-adjacent-rebased-sync.yml'
permissions:
  contents: write
jobs:
  regress-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20261021-adjacent-spawns-rebased-current-main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Adjacent spawn and complete Ranger aimed action regressions
        run: |
          node --test test/20261021-adjacent-monsterspawn-combat.test.mjs test/20261021-real-spawn-geometry-aimed-ranger.test.mjs test/20261020-shared-spawn-multi-farmer.test.mjs
      - name: Full runtime builds and offline regression suite
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          npm test
      - name: Persist generated files from tested source only
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync generic safe adjacent spawn combat runtime'
          git pull --rebase origin fix/20261021-adjacent-spawns-rebased-current-main
          git push origin HEAD:refs/heads/fix/20261021-adjacent-spawns-rebased-current-main
