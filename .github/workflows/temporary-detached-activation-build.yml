name: Temporary detached candidate runtime artifacts
on:
  push:
    branches: [feat/config-sync-detached-activation-dryrun-20261024]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && github.repository == 'Riflex91/ALBot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify independent Full-v1 candidate and restart boundaries
        run: node --test konfigurator/test/config-sync-detached-candidate.test.mjs
      - name: Build 0.53 unsigned candidate from source, without changing CODE prefix
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          npm test
      - name: Publish only generated and tested runtime artifacts on branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bot.js dist/albot.bootstrap.auto.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html editor/albot.settings.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(candidate): synchronize detached signed Full-v1 analysis 0.53'
            git push origin HEAD:feat/config-sync-detached-activation-dryrun-20261024
          fi
