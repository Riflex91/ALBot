name: Temporary ALBot independent one-shot final sync
on:
  push:
    branches:
      - fix/20261020-independent-one-shot-farmers
    paths:
      - '.github/workflows/one-shot-final-sync-temp.yml'
permissions:
  contents: write
jobs:
  final-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild and complete verification against merged main
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          npm test
      - name: Push exact build artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync independently verified one-shot AoE runtime'
          git pull --rebase origin fix/20261020-independent-one-shot-farmers
          git push origin HEAD:refs/heads/fix/20261020-independent-one-shot-farmers
