name: Temporary 0.47 safe-point candidate synchronization
on:
  push:
    branches:
      - feat/config-sync-safepoint-preflight-20261024
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && github.repository == 'Riflex91/ALBot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build unsigned candidate and preserve exact private CODE prefix
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
      - name: Full regression and public-asset audit
        run: |
          npm test
          npm run build:konfigurator
          node konfigurator/scripts/verify-public-assets.mjs
      - name: Commit only tested, generated candidate bytes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bot.js dist/albot.bootstrap.auto.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html editor/albot.settings.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(candidate): synchronize source-aligned 0.47 safe-point artifacts'
            git push origin HEAD:feat/config-sync-safepoint-preflight-20261024
          fi
