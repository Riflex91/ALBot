name: Sync compact-bank v0.20 (temporary)
on:
  push:
    branches:
      - fix/merchant-compact-bank-telemetry-current-main-20261020
permissions:
  contents: write
jobs:
  synchronize:
    if: "!startsWith(github.event.head_commit.message, 'build(bank-current):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merchant-compact-bank-telemetry-current-main-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build runtime from new main
        run: npm run build
      - name: Keep personal config byte-for-byte
        run: node scripts/sync-personal-code.mjs --write
      - name: Recreate pinned auto-bootstrap template
        run: npm run build:bootstrap:auto
      - name: Verify all candidate contracts and tests
        run: |
          node scripts/sync-personal-code.mjs --check
          npm run check:bootstrap:auto
          npm test
      - name: Build editor
        run: npm run build:editor
      - name: Commit only reproducible candidate artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist editor profiles
          if git diff --cached --quiet; then
            echo "No candidate artifact changes"
            exit 0
          fi
          git commit -m "build(bank-current): sync unsigned v0.20 on latest combat main"
          git push origin HEAD:fix/merchant-compact-bank-telemetry-current-main-20261020
