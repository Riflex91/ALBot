name: Temporary signed-release-cadence v0.23 validation
on:
  push:
    branches:
      - release/20261021-configured-3shot-v023
    paths:
      - '.github/workflows/temp-release-v023-cadence.yml'
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-configured-3shot-v023
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Strict 0.23 runtime and complete Linux preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
          npm run build:editor
          node --test test/20261021-real-spawn-geometry-aimed-ranger.test.mjs
          npm test
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-configured-3shot-v023
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native Windows full preflight
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm.cmd run build
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          node scripts/sync-personal-code.mjs --write
          if($LASTEXITCODE -ne 0){throw 'Sync failed'}
          npm.cmd run build:bootstrap:auto
          if($LASTEXITCODE -ne 0){throw 'V2 bootstrap failed'}
          ./scripts/VERIFY-U01-U07.ps1
          if($LASTEXITCODE -ne 0){throw 'Windows verify failed'}
  stage:
    needs: [linux,windows]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/20261021-configured-3shot-v023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Final source-aligned generated runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run check:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          npm run build:editor
          npm test
      - name: Commit source-generated runtime only
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- bot.js dist/ editor/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ALBot CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: align mandatory signed 0.23.0 runtime'
          git pull --rebase origin release/20261021-configured-3shot-v023
          git push origin HEAD:refs/heads/release/20261021-configured-3shot-v023
