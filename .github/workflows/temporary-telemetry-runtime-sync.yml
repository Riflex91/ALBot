name: Temporary telemetry runtime artifact sync
on:
  push:
    branches: [fix/telemetry-runtime-diagnostics-timeout-20261021]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ github.repository == 'Riflex91/ALBot' && github.ref == 'refs/heads/fix/telemetry-runtime-diagnostics-timeout-20261021' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and synchronize source-aligned runtime (not signed release)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm ci --ignore-scripts
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          npm run build:bootstrap:auto
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/manifest.json dist/albot.settings.json dist/albot.bootstrap.auto.js editor/Bot-Werkstatt.html editor/albot.settings.json profiles/full-solo.json profiles/full-team.json
          if git diff --cached --quiet; then
            echo "Runtime artifacts unchanged (unexpected for telemetry source update)" >&2
            exit 1
          fi
          git commit -m "build(telemetry): synchronize runtime diagnostics artifacts [skip sync]"
          git push origin "HEAD:fix/telemetry-runtime-diagnostics-timeout-20261021"
