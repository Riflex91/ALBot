name: TEMP PR400 Refresh After Tracktrix
on:
  push:
    branches: [fix/w03-w04-recovery-followup-20261022]
permissions: {contents: write}
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node --test test/roadmap-w04-reclaim-recovery.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Commit refreshed runtime and editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u bot.js dist editor profiles
          if ! git diff --cached --quiet; then
            git commit -m "build: align PR400 with merged Tracktrix runtime"
            git push origin "HEAD:fix/w03-w04-recovery-followup-20261022"
          fi
