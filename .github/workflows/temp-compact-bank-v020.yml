name: Sync compact-bank runtime candidate (temporary)
on:
  push:
    branches:
      - fix/merchant-compact-bank-telemetry-20261020
permissions:
  contents: write
jobs:
  synchronize:
    if: "!startsWith(github.event.head_commit.message, 'build(bank-telemetry):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merchant-compact-bank-telemetry-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build candidate v0.20
        run: npm run build
      - name: Preserve personal ALBotConfig in rebuilt CODE
        run: node scripts/sync-personal-code.mjs --write
      - name: Rebuild pinned auto-bootstrap source
        run: npm run build:bootstrap:auto
      - name: Validate candidate offline
        run: |
          node scripts/sync-personal-code.mjs --check
          npm run check:bootstrap:auto
          npm test
      - name: Build classic editor
        run: npm run build:editor
      - name: Sync only generated candidate artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist editor profiles
          if git diff --cached --quiet; then
            echo "No changes in candidate artifacts"
            exit 0
          fi
          git commit -m "build(bank-telemetry): synchronize unsigned 0.20 candidate"
          git push origin HEAD:fix/merchant-compact-bank-telemetry-20261020
