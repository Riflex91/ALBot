name: Temporary hop branch build and verification
on:
  push:
    branches:
      - fix/server-hop-lifecycle-recovery-20261017
permissions:
  contents: write
jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: npm test
      - name: Persist generated bundle in feature branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.js dist editor/Bot-Werkstatt.html editor/albot.settings.json profiles/full-solo.json profiles/full-team.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync verified runtime, personalized bot.js, and generated assets'
            git push origin HEAD:fix/server-hop-lifecycle-recovery-20261017
          fi
