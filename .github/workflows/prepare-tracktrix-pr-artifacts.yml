name: Prepare Tracktrix PR runtime artifacts
on:
  push:
    branches:
      - fix/tracktrix-request-modal-close-20261022
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: npm run build:konfigurator
      - run: npm test
      - name: Commit exact-source-generated review artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/ editor/Bot-Werkstatt.html editor/albot.settings.json profiles/ konfigurator/public/
          if ! git diff --cached --quiet; then
            git commit -m 'build(tracktrix): synchronize generated review artifacts'
            git push origin HEAD:fix/tracktrix-request-modal-close-20261022
          fi
