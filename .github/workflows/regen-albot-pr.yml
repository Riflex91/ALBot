name: Temporary W04 partial-reserve artifact synchronization
on:
  push:
    branches:
      - codex/w04-partial-reserve-staging-20261018
    paths:
      - .github/workflows/regen-albot-pr.yml
      - src/merchant/bank.mjs
      - src/merchant/bank-partial-recovery.mjs
      - scripts/pool-runtime-strings.mjs
      - test/roadmap-w04-bank-disposition.test.mjs
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'Riflex91/ALBot'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm test
      - run: npm run build:editor
      - name: Commit updated runtime artifacts to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync W04 partial-stage runtime while preserving personal config"
            git push origin HEAD:codex/w04-partial-reserve-staging-20261018
          fi
