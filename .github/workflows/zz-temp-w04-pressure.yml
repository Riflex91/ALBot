name: TEMP W04 pressure-checked runtime sync
on:
  push:
    branches: [roadmap/w04-live-pressure-revalidation-20261023]
permissions: {contents: write}
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: node --test test/bank-pressure-per-pack.test.mjs test/roadmap-w04-bank-disposition.test.mjs test/bank-observed-length.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - name: Commit verified generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u bot.js dist editor profiles
          if ! git diff --cached --quiet; then
            git commit -m "build: sync W04 physical bank pressure runtime"
            git push origin "HEAD:roadmap/w04-live-pressure-revalidation-20261023"
          fi
