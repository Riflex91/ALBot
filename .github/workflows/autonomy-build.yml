name: Build autonomy candidate
on:
  push:
    branches: [codex/autonomy-completion-20261018]
permissions:
  contents: write
concurrency:
  group: autonomy-candidate-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: node scripts/verify-bootstrap-contract.mjs
      - run: node scripts/verify-bootstrap-channel.mjs
      - run: npm test
      - run: npm run build:editor
      - name: Preserve personal configuration and commit generated artifacts
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const cfg=s=>s.slice(s.indexOf('globalThis.ALBotConfig='),s.indexOf('/* ALBot '));
          if(cfg(fs.readFileSync('bot.js','utf8'))!==cfg(execFileSync('git',['show','HEAD:bot.js'],{encoding:'utf8'})))throw Error('Personal configuration drift');
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: regenerate verified autonomy runtime and editor"
          git push origin HEAD:codex/autonomy-completion-20261018
