name: Prepare farmer-first release artifacts
on:
  push:
    branches: [fix/farmer-first-merchant-gear-20261021]
permissions:
  contents: write
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/merchant-farmer-first-equip.test.mjs
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: node scripts/verify-bootstrap-contract.mjs
      - run: npm run check:bootstrap:auto
      - name: Commit generated artifacts for normal cross-platform PR CI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(build): refresh candidate bootstrap artifacts [generated]"
          git push origin HEAD:fix/farmer-first-merchant-gear-20261021
