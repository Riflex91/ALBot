name: Generate combat-risk candidate artifacts
on:
  push:
    branches:
      - codex/combat-effect-risk-assertive45-20261024
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and synchronize personalized runtime
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:bootstrap:auto
          npm run build:bootstrap
      - name: Run all regressions
        run: npm test
      - name: Save reproducible candidate outputs back to development branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json dist/albot.bootstrap.auto.js dist/albot.bootstrap.js profiles/full-solo.json profiles/full-team.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(candidate): synchronize validated 0.52.0 combat outputs"
          git push origin HEAD:codex/combat-effect-risk-assertive45-20261024
