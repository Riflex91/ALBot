name: Temporary N12 Cave team isolation build
on:
  push:
    branches: [codex/n12-cave-team-coordination-20261020]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: N12 Cave team, farmer and world regressions
        run: |
          node --test test/roadmap-n12-cave-team-coordination.test.mjs test/roadmap-n12-cave-consensus.test.mjs test/roadmap-n12-cave-vote-preflight.test.mjs test/roadmap-n12-cave-durable-vote.test.mjs test/roadmap-n12-cave-evidence.test.mjs test/roadmap-n12-cave-durable-lifecycle.test.mjs test/roadmap-n12-cave-exit-lifecycle.test.mjs test/roadmap-n12-cave-entry-preflight.test.mjs test/roadmap-n12-cave-persistence-port.test.mjs test/20261019-teamflow.test.mjs test/team-check.test.mjs
      - name: Build browser and headless runtime and editor; verify signed channel
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          node scripts/sync-personal-code.mjs --check
          node scripts/verify-bootstrap-contract.mjs
          node scripts/verify-bootstrap-channel.mjs
      - name: Commit generated runtime and editor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json editor/Bot-Werkstatt.html editor/albot.settings.json editor/example-profile.json
          if ! git diff --cached --quiet; then
            git commit -m "build(N12): synchronize Cave team isolation runtime and editor"
            git push origin HEAD:codex/n12-cave-team-coordination-20261020
          fi
