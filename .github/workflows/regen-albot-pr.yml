name: Temporary bootstrap artifact regeneration
on:
  push:
    branches:
      - codex/bootstrap-artifact-size-decoupling-20261018
    paths:
      - .github/workflows/regen-albot-pr.yml
      - editor/lib/contract.mjs
      - scripts/build.mjs
      - scripts/sync-personal-code.mjs
      - test/bootstrap-runtime-size.test.mjs
      - test/integration.test.mjs
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'Riflex91/ALBot'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm test
      - run: npm run build:editor
      - name: Commit reconciled runtime, retaining personal CODE configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json profiles/full-solo.json profiles/full-team.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize bootstrap artifacts and original personal config"
            git push origin HEAD:codex/bootstrap-artifact-size-decoupling-20261018
          fi
