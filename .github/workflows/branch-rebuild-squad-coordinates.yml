name: Temporary ALBot squad real-position artifact parity
on:
  push:
    branches: [codex/fix-emergency-squad-regroup-20261019]
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/sync-personal-code.mjs --write
      - run: npm run build:editor
      - run: node scripts/verify-bootstrap-contract.mjs
      - run: npm test
      - name: Sync built runtime and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot.js dist/albot.js dist/albot.runtime.js dist/albot.package.json dist/albot.settings.json dist/manifest.json editor/Bot-Werkstatt.html
          git rm -- .github/workflows/branch-rebuild-squad-coordinates.yml
          git commit -m "build(combat): regenerate real-coordinate 0.16 artifacts [skip ci]"
          git push origin HEAD:codex/fix-emergency-squad-regroup-20261019
