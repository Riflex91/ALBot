name: Temporary ALBot telemetry candidate build sync
on:
  push:
    branches:
      - ci/telemetry-v024-artifact-sync-20261021
    paths:
      - '.github/workflows/telemetry-candidate-artifacts.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-private-telemetry-v024-20261021
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build exact feature branch and validate sender
        run: |
          npm run build
          node scripts/sync-personal-code.mjs --write
          npm run build:editor
          npm run build:konfigurator
          node --test konfigurator/test/automatic-telemetry.test.mjs
      - name: Commit only generated tracked review artifacts to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- bot.js dist editor profiles
          if git diff --cached --quiet; then
            echo "Generated artifacts already match branch."
            exit 0
          fi
          git commit -m "build: synchronize automatic telemetry v024 candidate artifacts"
          git push origin "HEAD:feat/automatic-private-telemetry-v024-20261021"
